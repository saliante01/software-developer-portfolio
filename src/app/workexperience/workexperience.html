<section id="work" class="relative py-24 px-6 md:px-16 overflow-hidden" style="background: #eeece9;">

  <!-- Diagonal negra fondo derecha -->
  <div class="absolute top-0 right-0 h-full z-0"
       style="width: 38%; background: #111;
              clip-path: polygon(35% 0%, 100% 0%, 100% 100%, 0% 100%);">
  </div>

  <!-- Puntos decorativos -->
  <div class="absolute top-16 left-6 z-0 grid gap-3"
       style="grid-template-columns: repeat(4, 10px);">
    <div *ngFor="let d of dots"
         style="width: 6px; height: 6px; border-radius: 50%; background: #ccc;">
    </div>
  </div>

  <div #timelineSection class="relative z-10 max-w-7xl mx-auto">

    <!-- Header -->
    <div style="transition: opacity 800ms ease, transform 800ms ease;"
         [style.opacity]="headerVisible ? '1' : '0'"
         [style.transform]="headerVisible ? 'translateY(0)' : 'translateY(-24px)'">
      <p style="font-size: 13px; font-weight: 700; letter-spacing: 3px;
                text-transform: uppercase; color: #999;">
        {{ 'work.done' | translate }}
      </p>
      <h2 style="font-family: 'Barlow Condensed', 'Arial Black', Impact, sans-serif;
                 font-weight: 900; font-size: clamp(42px, 6vw, 72px);
                 color: #111; margin-top: 6px; letter-spacing: -1px;">
        {{ 'work.title' | translate }}
      </h2>
    </div>

    <!-- Timeline -->
    <div class="relative mt-20" style="padding-bottom: 40px;">

      <!-- Línea vertical desktop -->
      <div class="hidden md:block absolute"
           style="left: 50%; top: 0; width: 2px; transform: translateX(-50%); z-index: 1;
                  background: linear-gradient(to bottom, #aaa, #555);
                  transition: height 1000ms ease;"
           [style.height]="lineVisible ? '100%' : '0%'">
      </div>

      <!-- Items -->
      <div *ngFor="let exp of experiences; let i = index; let last = last"
           class="relative w-full">

        <!-- ===== MOBILE LAYOUT ===== -->
        <div class="flex md:hidden items-start gap-4 mb-8">
          <div class="flex flex-col items-center">
            <div [style.width.px]="i >= 4 ? 60 : 44"
                 [style.height.px]="i >= 4 ? 60 : 44"
                 class="rounded-full bg-[#2d2d2d] border-[3px] border-[#555] flex items-center justify-center shadow-lg flex-shrink-0 z-20"
                 style="transition: opacity 700ms ease, transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);"
                 [style.opacity]="exp.visible ? '1' : '0'"
                 [style.transform]="exp.visible ? 'scale(1)' : 'scale(0)'">
              <ng-container *ngIf="exp.safeSvg; else imgMobile">
                <div [innerHTML]="exp.safeSvg" [style.width.px]="i >= 4 ? 32 : 24" [style.height.px]="i >= 4 ? 32 : 24"></div>
              </ng-container>
              <ng-template #imgMobile>
                <img [src]="exp.logo" [alt]="exp.company"
                     [style.width.px]="i >= 4 ? 36 : 22"
                     [style.height.px]="i >= 4 ? 36 : 22"
                     [style.borderRadius]="i === 4 ? '50%' : '0'"
                     style="object-fit: contain;" />
              </ng-template>
            </div>
            <div *ngIf="!last" class="w-[2px] flex-1 min-h-[60px]"
                 style="background: linear-gradient(to bottom, #aaa, #555);"></div>
          </div>
          <div class="flex-1 pb-4"
               style="transition: opacity 700ms ease, transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);"
               [style.opacity]="exp.visible ? '1' : '0'"
               [style.transform]="exp.visible ? 'translateX(0)' : 'translateX(-20px)'">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
                         text-transform: uppercase; color: #777;">
              {{ exp.date }}
            </span>
            <div style="background: #e8e6e2; border-radius: 12px; padding: 16px 20px; margin-top: 6px;
                        box-shadow: 4px 4px 16px rgba(0,0,0,0.08);">
              <h3 style="font-weight: 900; font-size: 14px; letter-spacing: 1.5px;
                         text-transform: uppercase; color: #111;">
                {{ exp.title }}
              </h3>
              <p style="font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
                        color: #888; margin-top: 4px; font-weight: 600;">
                {{ exp.company }}
              </p>
            </div>
          </div>
        </div>

        <!-- ===== DESKTOP LAYOUT — grilla 3 columnas simétricas ===== -->
        <div class="hidden md:grid mb-16"
             style="grid-template-columns: 1fr 72px 1fr; align-items: center; min-height: 100px;">

          <!-- PAR (i % 2 === 0): tarjeta IZQUIERDA, fecha DERECHA -->
          <ng-container *ngIf="i % 2 === 0">

            <!-- Columna 1: tarjeta -->
            <div class="flex justify-end pr-6"
                 style="transition: opacity 700ms ease, transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);"
                 [style.opacity]="exp.visible ? '1' : '0'"
                 [style.transform]="exp.visible ? 'translateX(0)' : 'translateX(-80px)'">
              <div style="background: #e8e6e2; border-radius: 12px; padding: 20px 28px;
                          width: 100%; max-width: 340px;
                          box-shadow: 4px 4px 16px rgba(0,0,0,0.08);">
                <h3 style="font-weight: 900; font-size: 15px; letter-spacing: 2px;
                           text-transform: uppercase; color: #111; line-height: 1.3;">
                  {{ exp.title }}
                </h3>
                <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
                          color: #888; margin-top: 6px; font-weight: 600; line-height: 1.4;">
                  {{ exp.company }}
                </p>
              </div>
            </div>

            <!-- Columna 2: flecha + círculo + flecha (zona central) -->
            <div class="flex items-center justify-center relative"
                 style="transition: opacity 700ms ease;"
                 [style.opacity]="exp.visible ? '1' : '0'">
              <!-- Flecha izq→círculo -->
              <span style="color: #666; font-size: 11px; position: absolute; left: 2px;">▶</span>
              <!-- Círculo -->
              <div [style.width.px]="i >= 4 ? 72 : 52"
                   [style.height.px]="i >= 4 ? 72 : 52"
                   style="border-radius: 50%; background: #2d2d2d; border: 3px solid #555;
                          box-shadow: 0 4px 16px rgba(0,0,0,0.3);
                          display: flex; align-items: center; justify-content: center;
                          position: relative; z-index: 2;
                          transition: transform 700ms ease;"
                   [style.transform]="exp.visible ? 'scale(1)' : 'scale(0)'">
                <ng-container *ngIf="exp.safeSvg; else imgDesktopEven">
                  <div [innerHTML]="exp.safeSvg" [style.width.px]="i >= 4 ? 36 : 26" [style.height.px]="i >= 4 ? 36 : 26"></div>
                </ng-container>
                <ng-template #imgDesktopEven>
                  <img [src]="exp.logo" [alt]="exp.company"
                       [style.width.px]="i >= 4 ? 42 : 26"
                       [style.height.px]="i >= 4 ? 42 : 26"
                       [style.borderRadius]="i === 4 ? '50%' : '0'"
                       style="object-fit: contain;" />
                </ng-template>
              </div>
            </div>

            <!-- Columna 3: fecha -->
            <div class="flex justify-start pl-6"
                 style="transition: opacity 700ms ease, transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);"
                 [style.opacity]="exp.visible ? '1' : '0'"
                 [style.transform]="exp.visible ? 'translateX(0)' : 'translateX(80px)'">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
                           text-transform: uppercase; color: #777;">
                {{ exp.date }}
              </span>
            </div>

          </ng-container>

          <!-- IMPAR (i % 2 !== 0): fecha IZQUIERDA, tarjeta DERECHA -->
          <ng-container *ngIf="i % 2 !== 0">

            <!-- Columna 1: fecha -->
            <div class="flex justify-end pr-6"
                 style="transition: opacity 700ms ease, transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);"
                 [style.opacity]="exp.visible ? '1' : '0'"
                 [style.transform]="exp.visible ? 'translateX(0)' : 'translateX(-80px)'">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
                           text-transform: uppercase; color: #777;">
                {{ exp.date }}
              </span>
            </div>

            <!-- Columna 2: círculo + flecha -->
            <div class="flex items-center justify-center relative"
                 style="transition: opacity 700ms ease;"
                 [style.opacity]="exp.visible ? '1' : '0'">
              <!-- Círculo -->
              <div [style.width.px]="i >= 4 ? 72 : 52"
                   [style.height.px]="i >= 4 ? 72 : 52"
                   style="border-radius: 50%; background: #2d2d2d; border: 3px solid #555;
                          box-shadow: 0 4px 16px rgba(0,0,0,0.3);
                          display: flex; align-items: center; justify-content: center;
                          position: relative; z-index: 2;
                          transition: transform 700ms ease;"
                   [style.transform]="exp.visible ? 'scale(1)' : 'scale(0)'">
                <ng-container *ngIf="exp.safeSvg; else imgDesktopOdd">
                  <div [innerHTML]="exp.safeSvg" [style.width.px]="i >= 4 ? 36 : 26" [style.height.px]="i >= 4 ? 36 : 26"></div>
                </ng-container>
                <ng-template #imgDesktopOdd>
                  <img [src]="exp.logo" [alt]="exp.company"
                       [style.width.px]="i >= 4 ? 42 : 26"
                       [style.height.px]="i >= 4 ? 42 : 26"
                       [style.borderRadius]="i === 4 ? '50%' : '0'"
                       style="object-fit: contain;" />
                </ng-template>
              </div>
              <!-- Flecha círculo→derecha -->
              <span style="color: #666; font-size: 11px; position: absolute; right: 2px;">▶</span>
            </div>

            <!-- Columna 3: tarjeta -->
            <div class="flex justify-start pl-6"
                 style="transition: opacity 700ms ease, transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);"
                 [style.opacity]="exp.visible ? '1' : '0'"
                 [style.transform]="exp.visible ? 'translateX(0)' : 'translateX(80px)'">
              <div style="background: #e8e6e2; border-radius: 12px; padding: 20px 28px;
                          width: 100%; max-width: 340px;
                          box-shadow: 4px 4px 16px rgba(0,0,0,0.08);">
                <h3 style="font-weight: 900; font-size: 15px; letter-spacing: 2px;
                           text-transform: uppercase; color: #111; line-height: 1.3;">
                  {{ exp.title }}
                </h3>
                <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
                          color: #888; margin-top: 6px; font-weight: 600; line-height: 1.4;">
                  {{ exp.company }}
                </p>
              </div>
            </div>

          </ng-container>

        </div>

      </div>

      <!-- Nodo final Resume (desktop) -->
      <div class="hidden md:grid"
           style="grid-template-columns: 1fr 72px 1fr; align-items: center;">

        <div class="flex justify-end pr-6">
          <div style="background: #e8e6e2; border-radius: 12px; padding: 20px 28px;
                      width: 100%; max-width: 340px;
                      box-shadow: 4px 4px 16px rgba(0,0,0,0.08);
                      display: flex; justify-content: center;">
            <a href="#"
               style="background: #111; color: #fff; padding: 12px 28px;
                      border-radius: 8px; font-size: 12px; font-weight: 800;
                      letter-spacing: 2px; text-transform: uppercase;
                      text-decoration: none; display: flex; align-items: center; gap: 10px;">
              {{ 'work.resume' | translate }}
              <i class="fa-solid fa-download"></i>
            </a>
          </div>
        </div>

        <div class="flex items-center justify-center">
          <div style="width: 52px; height: 52px; border-radius: 50%;
                      background: #2d2d2d; border: 3px solid #555;
                      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
                      display: flex; align-items: center; justify-content: center;
                      position: relative; z-index: 2;">
            <i class="fa-solid fa-file-lines" style="color: #fff; font-size: 18px;"></i>
          </div>
        </div>

        <div class="w-full"></div>
      </div>

      <!-- Nodo final Resume (mobile) -->
      <div class="flex md:hidden items-start gap-4 mt-4">
        <div class="flex flex-col items-center">
          <div class="w-[44px] h-[44px] rounded-full bg-[#2d2d2d] border-[3px] border-[#555] flex items-center justify-center shadow-lg flex-shrink-0">
            <i class="fa-solid fa-file-lines" style="color: #fff; font-size: 18px;"></i>
          </div>
        </div>
        <div>
          <a href="#"
             style="background: #111; color: #fff; padding: 10px 22px;
                    border-radius: 8px; font-size: 11px; font-weight: 800;
                    letter-spacing: 2px; text-transform: uppercase;
                    text-decoration: none; display: flex; align-items: center; gap: 8px;">
            {{ 'work.resume' | translate }}
            <i class="fa-solid fa-download"></i>
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
